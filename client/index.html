<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── PWA / Native App Meta ──────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#060c1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LCU Store" />
    <link rel="apple-touch-icon" href="/logo.png?v=3" />
    <link rel="apple-touch-startup-image" href="/logo.png?v=3" />

    <!-- ── Icons ───────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="/logo.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png?v=3" />

    <!-- ── Viewport (safe area for notch / home indicator) ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <!-- ── SEO ────────────────────────────────────────────── -->
    <meta name="description" content="The official Lead City University student store (LCS) — buy, sell, connect within campus." />
    <meta name="keywords" content="LCU, Lead City University, LCS, Lead City Store, buy sell, campus store, Nigeria" />
    <meta property="og:title" content="Lead City Store (LCS) | Buy, Sell, Connect" />
    <meta property="og:description" content="Buy, sell and connect within LCU campus. The trusted student store." />
    <meta property="og:type" content="website" />
    <title>Lead City Store (LCS) | Buy, Sell, Connect</title>

    <!-- ── Image CDN Preconnect ──────────────────────────── -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- ── Fonts ───────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />

    <!-- ── Flutterwave ─────────────────────────────────────── -->
    <script src="https://checkout.flutterwave.com/v3.js" defer></script>

    <!-- ── Service Worker Registration ──────────────────────── -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
